packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true

onlyBuiltDependencies:
  - "@embedded-postgres/windows-x64"
  - "@embedded-postgres/linux-x64"
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
